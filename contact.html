<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>お問い合わせ｜ぴるナビ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f7f7f5;color:#1a1a1a;font-family:'Noto Sans JP',sans-serif;font-size:14px;line-height:2}
.nav{height:56px;background:#fff;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100}
.nav-logo{font-size:18px;font-weight:900}
.nav-logo em{color:#00b894;font-style:normal}
.nav-back{font-size:13px;color:#888}
.wrap{max-width:560px;margin:0 auto;padding:48px 24px}
h1{font-size:24px;font-weight:900;margin-bottom:8px}
.sub{font-size:13px;color:#888;margin-bottom:36px;line-height:1.8}
.form-group{margin-bottom:20px}
label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:#333}
.required{color:#e17055;font-size:11px;margin-left:4px;font-weight:400}
input[type="text"],input[type="email"],textarea,select{
  width:100%;border:1.5px solid #ddd;border-radius:8px;
  padding:12px 14px;font-size:14px;font-family:inherit;
  background:#fff;color:#1a1a1a;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:#00b894}
textarea{height:160px;resize:vertical;line-height:1.8}
.submit-btn{width:100%;background:#1a1a1a;color:#fff;font-size:15px;font-weight:700;
  padding:15px;border-radius:100px;border:none;cursor:pointer;font-family:inherit;
  margin-top:8px;transition:opacity .15s}
.submit-btn:hover{opacity:.85}
.note{font-size:12px;color:#aaa;text-align:center;margin-top:16px;line-height:1.8}
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-logo">ぴる<em>ナビ</em></div>
  <a href="index.html" class="nav-back">← トップに戻る</a>
</nav>
<div class="wrap">
  <h1>お問い合わせ</h1>
  <p class="sub">掲載情報の誤り・ご意見・広告掲載のご相談など、お気軽にご連絡ください。<br>通常2〜3営業日以内にご返信します。</p>

  <form action="#" method="post">
    <div class="form-group">
      <label>お名前<span class="required">必須</span></label>
      <input type="text" name="name" placeholder="山田 花子" required>
    </div>
    <div class="form-group">
      <label>メールアドレス<span class="required">必須</span></label>
      <input type="email" name="email" placeholder="example@email.com" required>
    </div>
    <div class="form-group">
      <label>お問い合わせ種別<span class="required">必須</span></label>
      <select name="type" required>
        <option value="">選択してください</option>
        <option>掲載情報の誤りについて</option>
        <option>広告・掲載のご相談</option>
        <option>その他</option>
      </select>
    </div>
    <div class="form-group">
      <label>メッセージ<span class="required">必須</span></label>
      <textarea name="message" placeholder="お問い合わせ内容をご記入ください" required></textarea>
    </div>
    <button type="submit" class="submit-btn">送信する</button>
    <p class="note">送信内容は <a href="privacy.html" style="color:#00b894">プライバシーポリシー</a> に従って取り扱います。</p>
  </form>
</div>
</body>
</html>
